name: build

# Two jobs:
#   host-tests  -- builds the portable core + runs the regression suites
#                  (gcc + the open-source z8lua oracle). Fast correctness gate.
#   rom-build   -- installs the Calypsi toolchain from its official release and
#                  builds WLA-DX from source, then builds the flashable SNES
#                  ROM. Catches SNES-build breaks and produces the artifact;
#                  on a v* tag it publishes a release with the ROM attached.
#
# Calypsi is proprietary but free for personal, non-commercial (hobby) use.
# We do NOT redistribute it -- the runner installs it from the author's own
# GitHub release, exactly as a developer would. It cannot run Mesen, so the
# on-hardware (Mesen) tests still run locally.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write        # publish a release on a v* tag

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        # libreadline-dev: z8lua's Makefile links -lreadline -lhistory
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev

      # z8lua is the correctness oracle for the numeric/dialect vectors,
      # pinned to the commit the committed goldens were produced against.
      - name: Build the z8lua oracle
        run: |
          git clone https://github.com/samhocevar/z8lua.git tools/z8lua
          git -C tools/z8lua checkout 8575dfbc
          make -C tools/z8lua
          test -x tools/z8lua/z8lua

      # numvec / dialectvec (vs z8lua) + gfxvec / audiovec (goldens). libvec
      # is left to local runs (host-compiler-sensitive; see core-c/Makefile).
      - name: Host regression suites
        run: make -C core-c check-ci

  rom-build:
    needs: host-tests
    runs-on: ubuntu-latest
    env:
      CAL: /usr/local/lib/calypsi-65816-5.17
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      # Fetch Calypsi from the author's official release (personal/hobby use
      # per its license; not redistributed by us). dpkg-deb -x unpacks the
      # binaries to /usr/local/lib/calypsi-65816-5.17/{bin,lib}.
      - name: Install the Calypsi 65816 toolchain
        run: |
          curl -fsSL -o /tmp/calypsi.deb \
            https://github.com/hth313/Calypsi-tool-chains/releases/download/5.17/calypsi-65816-5.17.deb
          sudo dpkg-deb -x /tmp/calypsi.deb /
          "$CAL/bin/cc65816" --version

      # WLA-DX (open source) supplies the SPC700 assembler + linker.
      - name: Build WLA-DX
        run: |
          git clone --depth 1 --branch v10.7 https://github.com/vhelin/wla-dx.git /tmp/wla
          cmake -S /tmp/wla -B /tmp/wla/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/wla/build -j"$(nproc)"
          echo "WLABIN=$(dirname "$(find /tmp/wla/build -name wla-65816 -type f | head -1)")" >> "$GITHUB_ENV"

      - name: Build the release ROM
        run: make -C snes release P8CALDIR="$CAL" CALDIR="$CAL" PVBIN="$WLABIN"

      # A bytecode variant of the same ROM: the cart Lua is precompiled on
      # the runner by p8luac (built here from core-c) -- boots ~3x faster
      # and exercises the whole cross-dumper pipeline on a clean Linux host.
      - name: Build the bytecode release ROM
        run: |
          make -C snes release P8BYTECODE=1 RELEASEROM=build/snespico8-bytecode.sfc \
            P8CALDIR="$CAL" CALDIR="$CAL" PVBIN="$WLABIN"

      # Single-cart "just play it" ROMs from our own test carts (all freely
      # shippable): video, joypad and audio demos, one .sfc each.
      - name: Build the test-cart ROMs
        run: |
          mkdir -p snes/build/roms
          for cart in demo_video demo_input m6_demo; do
            make -C snes play PLAYCART=../core-c/tests/carts/$cart.p8 P8BYTECODE=1 \
              P8CALDIR="$CAL" CALDIR="$CAL" PVBIN="$WLABIN"
            cp snes/build/p8.sfc snes/build/roms/$cart.sfc
          done
          cp snes/build/snespico8.sfc snes/build/roms/
          cp snes/build/snespico8-bytecode.sfc snes/build/roms/
          ls -la snes/build/roms/

      - name: Upload the ROM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snespico8-roms
          path: snes/build/roms/*.sfc

      # On a v* tag: publish a release with the ROM and auto-generated notes.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            snes/build/snespico8.sfc
            snes/build/snespico8-bytecode.sfc
          body: |
            snespico8 -- a PICO-8 runtime for a stock SNES. Built end to end by
            CI (host regression suites + the SNES ROM). The ROM ships only our
            own carts (no Lexaloffle/BBS assets), so it is freely
            redistributable. Flash snespico8.sfc, or run it in an emulator.
